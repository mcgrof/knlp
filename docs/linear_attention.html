<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear Attention &amp; Bounded Memory — DeltaNet, Gated DeltaNet, DeltaProduct, Trellis</title>
  <meta name="description" content="knlp's matched-harness study of the linear-attention / bounded-memory family — Trellis (implemented here) vs the FLA reference DeltaNet, Gated DeltaNet, and GatedDeltaProduct (arXiv:2512.23852). Verdict: at reachable scale Trellis's nonlinear memory write does not pay for itself — a param-matched A100 run puts it well behind both linear cousins. A structural point (the write is not affine in the state, so the exact WY/UT chunk factorization does not apply; the paper trains chunk-parallel on a chunk-start linearization instead) and a same-shell control (a linearized write beats the nonlinear one ~2x; our earlier control also linearized the inter-pass map, since decoupled, and a clean write-only rerun on the associative-recall probe puts the nonlinear write behind the linear). GatedDeltaProduct and Gated DeltaNet both solve the exact-overwrite binding grid, but GatedDeltaProduct loses to Gated DeltaNet on language-model loss. Gated DeltaNet is the matched-state quality leader.">

      <a href="ra_visualization.html" class="px-3 py-1.5 bg-gray-800 hover:bg-cyan-600 rounded text-sm font-medium text-gray-300 hover:text-white transition-colors">RA</a>
      <a href="fisher_adam_visualization.html" class="px-3 py-1.5 bg-gray-800 hover:bg-blue-600 rounded text-sm font-medium text-gray-300 hover:text-white transition-colors">FIM-Adam</a>

  <div id="root"></div>

  <script type="text/babel">
    const {
      LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend,
      ResponsiveContainer, ReferenceLine, Cell, ComposedChart, Label
    } = Recharts;

    const C = {
      indigo:'#6366f1', violet:'#8b5cf6', blue:'#3b82f6', green:'#10b981',
      amber:'#f59e0b', red:'#ef4444', cyan:'#06b6d4', gray:'#64748b', slate:'#334155', rose:'#f43f5e'
    };

    // ───────────────────────── DATA (verified: archives + arXiv:2512.23852) ─────────────────────────

    // Matched A100 run: C4 d256/L4, seq2048, ~352M tok (~20/total-param incl emb),
    // fp32-master + bf16-autocast, AdamW, fla REFERENCE baselines, Trellis fused-Triton kernel, one pod.
    const MATCHED = [
      {model:'Gated DeltaNet', short:'GatedDelta', ppl:78.49,  params:4.48, klass:'win',  note:'fla reference'},
      {model:'DeltaNet',       short:'DeltaNet',   ppl:89.77,  params:4.21, klass:'win',  note:'fla reference'},
      {model:'Trellis',        short:'Trellis',    ppl:152.54, params:4.74, klass:'mid',  note:'this work'},
      {model:'dense Transformer', short:'dense', ppl:224.89, params:4.72, klass:'lose', note:'KV grows with T'},
    ];

    // PG19 long-context: scratch Trellis vs matched dense (full-strength sequential, multi-seed).
    // Trellis beats dense and the margin holds/widens with context. (Family ordering here is
    // superseded by the fair A100 run; this panel shows the Trellis-vs-DENSE direction only.)
    const PG19 = [
      {len:'512',  trellis:1542, dense:1581, delta:-2.5},
      {len:'1024', trellis:1517, dense:1635, delta:-7.3},
      {len:'2048', trellis:585,  dense:621,  delta:-5.9},
      {len:'4096', trellis:546,  dense:622,  delta:-12.1},
    ];

    // Mixer-level throughput (A100, fwd+bwd, [B8,T2048,d256,H4]), tok/s in thousands.
    const THRU = [
      {mixer:'fla GatedDelta',    tps:3891, kind:'linear'},
      {mixer:'fla DeltaNet',      tps:3315, kind:'linear'},
      {mixer:'dense MHA',         tps:2941, kind:'dense'},
      {mixer:'Trellis (Triton)',  tps:770,  kind:'trellis'},
      {mixer:'Trellis (Python)',  tps:121,  kind:'slow'},
      {mixer:'our DeltaNet (bmm)',tps:85,   kind:'slow'},
    ];

    // Paper Table 1 — 790M params / 30B tokens (C4). PPL lower=better.
    const PAPER_790 = [
      {model:'Trellis',        ppl:20.28, best:true},
      {model:'Gated DeltaNet', ppl:21.40, best:false},
      {model:'Transformer++',  ppl:25.89, best:false},
      {model:'TTT',            ppl:27.05, best:false},
      {model:'Mamba2',         ppl:28.91, best:false},
    ];
    // Paper Table 2 — 125M ablation (The Pile). NO Gated-DeltaNet row at 125M.
    const PAPER_125 = [
      {row:'Trellis (full)',         ppl:10.87, kind:'full'},
      {row:'b=1 (no chunking)',      ppl:10.75, kind:'full'},
      {row:'w/o forget gate',        ppl:11.28, kind:'abl'},
      {row:'TTT',                    ppl:11.44, kind:'base'},
      {row:'DeltaNet',               ppl:11.58, kind:'base'},
      {row:'linear φ (f=LN-SiLU)',   ppl:11.65, kind:'abl'},
    ];

    // Empirical proof: same-shell identity-φ control (our harness, ~4.7M, d256/L4,
    // C4, 120M tok, seed0). Joint φ/f control (tied then; now decoupled);
    // linear delta rule beats nonlinear ~2× here.
    const IDENTITY = [
      {row:'identity-φ (linear delta rule)', lr:'3e-4', ppl:127.90, kind:'linear'},
      {row:'ln_silu + all paper toggles',    lr:'3e-3', ppl:182.83, kind:'nl'},
      {row:'ln_silu at matched LR',          lr:'3e-4', ppl:248.37, kind:'nl'},
      {row:'ln_silu default',                lr:'3e-3', ppl:260.61, kind:'nl'},
    ];

    // GatedDeltaProduct on real language loss: matched C4-en family run
    // (46.7M, d512/L10, seq2048, 20M tok, 3 seeds, fla reference layers, one stream).
    // DeltaProduct wins the exact-overwrite binding grid but LOSES to GDN on LM loss.
    const DPROD = [
      {model:'Gated DeltaNet',      short:'GatedDelta',   ppl:215.72, klass:'win'},
      {model:'GatedDeltaProduct',   short:'DeltaProduct', ppl:224.39, klass:'mid'},
      {model:'DeltaNet',            short:'DeltaNet',     ppl:254.50, klass:'win'},
      {model:'dense Transformer',   short:'dense',        ppl:377.91, klass:'lose'},
    ];

    // ───────────────────────── reusable components (knlp family idiom) ─────────────────────────
    function StatCard({label, value, unit, sub, color}) {
      return (
        <div className="stat-card rounded-lg p-4">
          <div className="text-gray-500 text-xs uppercase tracking-wide mb-1">{label}</div>
          <div className="text-2xl font-bold" style={{color: color||'#fff'}}>{value}<span className="text-sm text-gray-400 ml-1">{unit}</span></div>
          {sub && <div className="text-xs text-gray-500 mt-1">{sub}</div>}
        </div>
      );
    }
    function Tip({active, payload, label}) {
      if (!active || !payload || !payload.length) return null;
      return (
        <div className="bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm">
          {label !== undefined && <div className="text-gray-400 mb-1">{label}</div>}
          {payload.map((p, i) => (
            <div key={i} style={{color: p.color || p.fill}}>
              {p.name}: <strong>{typeof p.value === 'number' ? p.value.toLocaleString() : p.value}</strong>
            </div>
          ))}
        </div>
      );
    }
    function Section({id, kicker, title, children}) {
      return (
        <section id={id} className="anchor card rounded-xl p-6 md:p-8 mb-8">
          {kicker && <div className="text-xs uppercase tracking-widest mb-2" style={{color:C.violet}}>{kicker}</div>}
          <h2 className="text-2xl font-bold mb-4">{title}</h2>
          <div className="prose text-gray-400 text-[15px] leading-relaxed max-w-none">{children}</div>
        </section>
      );
    }
    function ChartFrame({title, sub, height, children}) {
      return (
        <div className="bg-[#0b1220] border border-gray-800 rounded-lg p-4 my-5">
          {title && <h4 className="text-sm font-semibold text-gray-200 mb-0.5">{title}</h4>}
          {sub && <p className="text-gray-500 text-xs mb-3">{sub}</p>}
          <ResponsiveContainer width="100%" height={height||320}>{children}</ResponsiveContainer>
        </div>
      );
    }
    const Pill = ({k, children}) => {
      const m = {win:'pill-win', mid:'pill-mid', lose:'pill-lose'};
      return <span className={`pill ${m[k]}`}>{children}</span>;
    };
    const KLASS = {win:C.green, mid:C.violet, lose:C.red};

    // ───────────────────────── the page ─────────────────────────
    function App() {
      return (
        <div className="max-w-5xl mx-auto px-5 py-12">
          {/* Header */}
          <header className="text-center mb-10">
            <a href="index.html" className="text-gray-500 text-sm hover:text-gray-300 mb-4 inline-block">&larr; Back to knlp</a>
            <h1 className="text-4xl md:text-5xl font-bold mb-4 leading-tight">
              <span className="gradient-text">Linear Attention</span> &amp; Bounded Memory
            </h1>
            <p className="text-gray-400 max-w-3xl mx-auto text-lg">
              A dense Transformer&rsquo;s KV cache grows with context; this family replaces it with a
              <strong className="text-gray-200"> fixed-size recurrent state</strong>. We implemented
              <strong className="text-gray-200"> Trellis</strong> in one matched harness and compared it against the fla
              <strong className="text-gray-200"> reference</strong> <strong className="text-gray-200">DeltaNet</strong>,
              <strong className="text-gray-200"> Gated DeltaNet</strong>, and
              <strong className="text-gray-200"> GatedDeltaProduct</strong> layers &mdash; to ask whether Trellis&rsquo;s
              <em> nonlinear</em> memory writer beats its <em>linear</em> cousins at matched size. At the scale we can
              afford the answer is no: a param-matched A100 run puts Trellis well behind both, and
              <strong className="text-gray-200"> Gated DeltaNet</strong> is the matched-state quality leader. We can say
              why &mdash; one structural point and one same-shell control, the control&rsquo;s magnitude carrying a caveat
              spelled out below.
            </p>
          </header>

          {/* Key stats */}
          <div className="grid grid-cols-2 md:grid-cols-6 gap-3 mb-8">
            <StatCard label="Models" value="3 + dense" sub="one matched harness" />
            <StatCard label="Trained scale" value="4.7" unit="M" sub="paper floor is 125M" />
            <StatCard label="Decode state" value="O(1)" sub="constant in context" color={C.green}/>
            <StatCard label="Nonlinear write" value="~2×" sub="same-shell joint φ/f control (since decoupled)" color={C.red}/>
            <StatCard label="Quality leader" value="GatedDelta" sub="matched-state C4" color={C.green}/>
            <StatCard label="Status" value="closed" sub="GDN leads; 790M parked" color={C.amber}/>
          </div>

          {/* TLDR */}
          <div className="card rounded-xl p-6 mb-8 border-l-4" style={{borderLeftColor:C.violet}}>
            <h3 className="font-semibold text-violet-400 mb-2">The result in one breath</h3>
            <p className="text-gray-300 text-[15px] leading-relaxed">
              Trellis&rsquo;s defining feature is a <em>nonlinear</em> memory write. At the scale we can afford to
              train, that write is a <strong className="text-white">liability</strong>, and the study closes on two
              load-bearing findings. <strong className="text-white">Structural:</strong> the nonlinear write is not
              affine in the recurrent state, so DeltaNet&rsquo;s exact chunkwise WY/UT factorization does not apply.
              Trellis still trains chunk-parallel &mdash; the paper freezes the state at each chunk&rsquo;s start, making
              the within-chunk recurrence locally linear and parallelizable by parallel scan &mdash; but that form is
              exact only for the linearized system; the true nonlinear recurrence costs a sequential pass.
              <strong className="text-white"> Empirical:</strong> a param-matched A100 run puts Trellis well behind both
              linear cousins, and a same-shell control that <em>linearizes</em> the write (identity &phi;, reducing it
              toward the delta rule) is nearly <strong className="text-white">2× better</strong> (127.9 vs 248.4 PPL)
              &mdash; though that control also linearized the inter-pass map (since decoupled), so the 2&times; is a joint
              control; the clean write-only rerun on the associative-recall probe puts the nonlinear write behind the
              linear, and the paper&rsquo;s own write-only LM cost is ~0.78 ppl; the 2026-08 correctness audit sharpened
              this further &mdash; the write ranking depends on the outer-gradient semantics (see the
              training-strategy section). Separately, GatedDeltaProduct
              &mdash; whose extra rotations ace an exact-overwrite task &mdash; also loses to Gated DeltaNet on real
              language-model loss. Gated DeltaNet is the matched-state leader. The one thing we did <em>not</em> test is
              the paper&rsquo;s 790M-parameter scale claim; it is parked, not disproven.
            </p>
          </div>

          {/* 1. lineage */}
          <Section id="lineage" kicker="Where it comes from" title="The delta-rule lineage">
            <p>
              The family descends from the <a href="https://isl.stanford.edu/~widrow/papers/c1960adaptiveswitching.pdf" className="text-violet-300 hover:underline"><strong>delta rule</strong> (Widrow &amp; Hoff, 1960)</a>,
              an online least-squares update that nudges a weight matrix to shrink a per-step prediction error.
              <a href="https://arxiv.org/pdf/2102.11174" className="text-violet-300 hover:underline">Schlag et al. (2021)</a> recast
              linear attention as a <strong>fast-weight</strong> memory written by exactly that update; the delta-rule model
              &mdash; later parallelized and scaled as <a href="https://arxiv.org/abs/2406.06484" className="text-violet-300 hover:underline"><strong>DeltaNet</strong></a> &mdash;
              is the linear baseline here. Adding a learned forget gate gives
              <a href="https://arxiv.org/abs/2412.06464" className="text-violet-300 hover:underline"><strong> Gated DeltaNet</strong></a>
              (<a href="https://podcast.do-not-panic.com/episodes/gated-delta-networks-for-long-context-retrieval/" className="text-violet-300 hover:underline">podcast</a>).
              A separate thread, test-time training (TTT, Titans, Atlas), reaches the same place from the optimization side.
              <a href="https://podcast.do-not-panic.com/episodes/trellis-and-bounded-memory-transformer-kv-compression/" className="text-violet-300 hover:underline"><strong> Trellis</strong></a>
              (<a href="https://arxiv.org/abs/2512.23852" className="text-violet-300 hover:underline">arXiv:2512.23852</a>) sits at the junction:
              a gated delta-rule memory whose inner write is a <em>nonlinear</em> gradient step. That single
              nonlinearity is the whole bet &mdash; it is what the paper credits for the long-context win, and
              what costs Trellis the cheap exact training kernel its linear cousins get for free.
            </p>
            <div className="flex flex-wrap items-center justify-center gap-2 text-sm my-4">
              {['delta rule (1960)','fast-weight linear attn (2021)','DeltaNet','Gated DeltaNet','test-time memory','Trellis'].map((n,i,a)=>(
                <React.Fragment key={i}>
                  <span className="px-3 py-1.5 rounded-lg bg-[#0b1220] border border-gray-800 text-gray-300">{n}</span>
                  {i<a.length-1 && <span className="text-violet-500">&rarr;</span>}
                </React.Fragment>
              ))}
            </div>
          </Section>

          {/* 2. what each is */}
          <Section id="models" kicker="The three writers" title="What each model actually computes">
            <p>
              All three keep a per-head recurrent state and read it <strong>write-before-read</strong> &mdash; the
              state is updated with the current token, then queried. The only difference that matters is whether
              the inner write is linear in the state.
            </p>
            <div className="grid md:grid-cols-3 gap-4 mt-2">
              <div className="bg-[#0b1220] border border-gray-800 rounded-lg p-4">
                <div className="flex items-center justify-between mb-2"><h4 className="font-semibold text-green-300"><a href="https://arxiv.org/abs/2406.06484" className="hover:underline">DeltaNet</a></h4><Pill k="win">linear</Pill></div>
                <p className="text-sm text-gray-400">Fast-weight matrix <span className="kbd">S</span>, delta-rule write
                <span className="kbd">S &larr; S + β(v − Sk)kᵀ</span>, read <span className="kbd">o = Sq</span>. Inner step
                is linear in <span className="kbd">S</span>, so it gets an <strong>exact chunk-parallel kernel</strong>.</p>
              </div>
              <div className="bg-[#0b1220] border border-gray-800 rounded-lg p-4">
                <div className="flex items-center justify-between mb-2"><h4 className="font-semibold text-green-300"><a href="https://podcast.do-not-panic.com/episodes/gated-delta-networks-for-long-context-retrieval/" className="hover:underline">Gated DeltaNet</a></h4><Pill k="win">linear</Pill></div>
                <p className="text-sm text-gray-400">DeltaNet plus a learned scalar decay
                <span className="kbd">S &larr; αS + β(v − αSk)kᵀ</span>. The gate lets memory forget, which matters at
                length. Still linear, still exact-chunkable &mdash; and the standout at the scale we can train.</p>
              </div>
              <div className="bg-[#0b1220] border border-gray-800 rounded-lg p-4">
                <div className="flex items-center justify-between mb-2"><h4 className="font-semibold text-violet-300"><a href="https://podcast.do-not-panic.com/episodes/trellis-and-bounded-memory-transformer-kv-compression/" className="hover:underline">Trellis</a></h4><Pill k="mid">nonlinear</Pill></div>
                <p className="text-sm text-gray-400">An <span className="kbd">m</span>-slot memory <span className="kbd">M</span>,
                one online-gradient step on <span className="kbd">½‖φ(Mw) − α‖²</span> per token:
                <span className="kbd">M &larr; βM − γ&middot;u wᵀ</span>, <span className="kbd">u = Jφ(z)ᵀ(φ(z)−α)</span>. The
                nonlinear <span className="kbd">φ</span> is the difference from DeltaNet, and the source of everything
                below. Two-pass (key then value).</p>
              </div>
            </div>
          </Section>

          {/* 3. the fair A100 result */}
          <Section id="fair" kicker="The decisive comparison" title="One clean run, one pod, fair baselines">
            <p>
              The comparison that settles it is a single A100 run under one protocol: C4, <span className="kbd">d256/L4</span>,
              sequence length 2048, &asymp;352M tokens (&asymp;20 per total parameter including embeddings, &asymp;74 per
              non-embedding parameter), fp32 master weights with bf16 autocast,
              the fla <strong>reference</strong> DeltaNet / Gated DeltaNet layers (short conv + qk-norm + output gate &mdash;
              not strawmen), and the Trellis fused kernel, all in the same pod.
            </p>
            <ChartFrame title="Validation perplexity — matched A100 run (lower is better)"
              sub="fla reference baselines, Trellis fused-Triton kernel, identical protocol. Green = linear cousins, violet = Trellis, red = dense.">
              <BarChart data={MATCHED} margin={{top:8, right:16, left:0, bottom:60}}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.slate}/>
                <XAxis dataKey="short" stroke="#94a3b8" angle={-25} textAnchor="end" height={80} interval={0} tick={{fontSize:11}}/>
                <YAxis stroke="#94a3b8" domain={[0,240]} label={{value:'val PPL', angle:-90, position:'insideLeft', fill:'#94a3b8'}}/>
                <Tooltip content={<Tip/>}/>
                <Bar dataKey="ppl" name="val PPL" radius={[3,3,0,0]}>
                  {MATCHED.map((d,i)=><Cell key={i} fill={KLASS[d.klass]}/>)}
                </Bar>
              </BarChart>
            </ChartFrame>
            <p>
              Trellis at 152.54 sits clearly between the dense baseline and the linear family &mdash; a normal
              <em> below-crossover</em> result, not near-dense. But it still loses to plain DeltaNet and to Gated
              DeltaNet, at a small <strong> parameter disadvantage to the baselines</strong> (it carries ~5&ndash;12%
              more non-embedding parameters and still loses, which makes the loss conservative). In nats at matched
              tokens, Trellis is <strong>+0.53 nat</strong> behind DeltaNet and <strong>+0.66</strong> behind Gated
              DeltaNet.
            </p>
            <div className="bg-[#0b1220] border border-gray-800 rounded-lg p-4 text-sm text-gray-400">
              <strong className="text-gray-200">Why this is the run that counts.</strong> It is the one comparison
              that is simultaneously matched in size, on a fair GPU, against the fla reference baselines (conv +
              qk-norm + output gate, not strawmen), and at a real token budget &mdash; so the ordering it gives is the
              one to trust over any smaller or less controlled run.
            </div>
          </Section>

          {/* 4. PG19 long context */}
          <Section id="pg19" kicker="The structural win" title="Bounded memory beats matched dense at length (our PG19 runs)">
            <p>
              In our tested PG19 configs, scratch Trellis beat a matched <strong>dense</strong> Transformer at every
              length we ran (512&ndash;4096), the margin largest at 4096 &mdash; the bounded-memory-at-length effect the
              architecture exists for, while Trellis&rsquo;s state stays constant in sequence length and dense&rsquo;s KV
              cache does not. The Trellis-beats-dense direction is solid; the family ordering (Trellis still trails Gated
              DeltaNet) is set by the fair A100 run above, and these PG19 baselines were the under-featured hand-rolled
              ones.
            </p>
            <ChartFrame title="PG19 — Trellis vs matched dense, by context length"
              sub="Multi-seed scratch training. Bars: val PPL (lower better). The Trellis-beats-dense direction is robust; the family ordering is settled by the fair A100 run above, not here.">
              <ComposedChart data={PG19} margin={{top:8, right:16, left:0, bottom:8}}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.slate}/>
                <XAxis dataKey="len" stroke="#94a3b8" label={{value:'context length', position:'insideBottom', offset:-4, fill:'#94a3b8'}}/>

            </ChartFrame>
          </Section>

          {/* 6. the structural limitation (math) */}
          <Section id="kernels" kicker="The structural limitation" title="Why the nonlinear write loses the standard exact kernel">
            <p>
              DeltaNet and Gated DeltaNet get an <strong>exact chunk-parallel kernel</strong> as a gift of linearity:
              each step is a fixed affine map of the state, affine maps compose, and the within-chunk coupling is a
              strictly-lower-triangular (nilpotent) system solved once &mdash; a whole chunk of serial rank-1 edits
              collapses into a few matmuls plus one small triangular solve: the WY low-rank representation compacts the
              chunk&rsquo;s rank-one transitions, and the UT triangular solve constructs those factors. This is the
              entire training speedup, and this factorization does not apply to Trellis&rsquo;s nonlinear write. The reason
              is structural, provable by composition over the chunk &mdash; a statement about this specific transform, not
              a proof that no exact method of any kind can exist:
            </p>
            <div className="bg-[#0b1220] border-l-4 rounded-lg p-4 my-4 text-sm" style={{borderLeftColor:C.violet}}>
              <strong className="text-violet-300">Sufficient condition (exact finite chunk transform).</strong>
              <span className="text-gray-400"> Fix a chunk after all token-derived quantities are computed. If the
              per-step update is affine in some fixed finite-dimensional state representation <span className="kbd">Ψ(M)</span>
              closed under the update (<span className="kbd">Ψ(M_t) = L_t Ψ(M_&#123;t-1&#125;) + c_t</span>, with
              <span className="kbd">L_t, c_t</span> independent of the state), an exact fixed-finite-dimensional linear
              chunk transform exists. With <span className="kbd">Ψ = id</span> this is affine-in-<span className="kbd">M</span>,
              which the delta rule satisfies. We do <em>not</em> claim the converse in general &mdash; only that the
              original-state WY/UT transform specifically requires affine-in-<span className="kbd">M</span>, and that for
              the paper&rsquo;s normalized-SiLU write no exact fixed finite lift is known.</span>
            </div>
            <p>
              Both writers share the update <span className="kbd">M &larr; diag(β)M − γ&middot;u wᵀ</span> and differ only
              in <span className="kbd">u</span>. The delta rule&rsquo;s <span className="kbd">u = Mw − α</span> is affine in
              <span className="kbd"> M</span> &mdash; it satisfies the theorem, so the exact kernel exists. Trellis&rsquo;s
              <span className="kbd"> u = Jφ(z)ᵀ(φ(z) − α)</span>, <span className="kbd">z = Mw</span>, is affine in
              <span className="kbd"> z</span> only if the Jacobian gain <span className="kbd">Jφ(z)</span> is constant, i.e.
              <span className="kbd"> φ</span> affine. For a generic state-dependent nonlinearity &mdash; the paper&rsquo;s
              normalized SiLU &mdash; <em>no</em> fixed finite affine lift is known, the within-chunk equations become
              nonlinear-triangular rather than a linear nilpotent solve, and the exact WY/UT transform is gone. What the
              paper actually does is explicit in its chunk form: it <em>freezes</em> the state &mdash; hence the
              Jacobian &mdash; at the chunk-start index, which makes the within-chunk recurrence locally linear and, in
              the paper&rsquo;s words, parallelizable by parallel scan. The parallelism survives; the exactness does
              not: the scanned system is the linearization, with error growing with the step size, the chunk length,
              and the curvature of <span className="kbd">φ</span>. This forward choice is only half of the training strategy; the
              other half &mdash; whether the outer loss differentiates <em>through</em> the frozen inner gradient
              &mdash; is an independent axis with its own section below.
            </p>
            <p className="text-xs text-gray-500">
              Two overclaims retired for honesty: &ldquo;nonlinear &rArr; no exact chunk&rdquo; is false in general
              (affine <span className="kbd">φ</span>, fixed-active-set ReLU, and polynomial/kernel lifts are exceptions
              &mdash; though the polynomial/kernel lifts grow the state dimension and are not a fixed WY transform); and
              the cost is not &ldquo;independent of chunk size&rdquo; (the solve grows with the chunk &mdash; what is
              chunk-independent is the count of sequential recurrent-state evaluations). The tightened statement and its
              six empirical controls are in the archive.
            </p>
            <h3 className="font-semibold text-gray-200 mt-6 mb-2">The fused kernel (making the slow path bearable)</h3>
            <p>
              Most of Trellis&rsquo;s apparent slowness, though, was a Python launch-bound loop, not the algorithm. A
              fused Triton kernel collapses the per-chunk launches into one persistent program per
              <span className="kbd">(batch, head)</span>, keeping the <span className="kbd">[64,64]</span> state tile
              resident and doing the LayerNorm-SiLU VJP in-register, with a hand-derived backward. The result: 26&ndash;44&times;
              on the forward, <strong>6.4&times; on the full mixer</strong> (120.7k &rarr; 769.8k tok/s), pulling Trellis
              from 0.04&times; to 0.26&times; of dense throughput and shrinking the gap to fla Gated DeltaNet from ~25&times;
              to <strong>~4&times;</strong>. The same kernel runs unmodified on the W7900 (ROCm) for an 8&ndash;12&times; win.
              It made the comparison tractable &mdash; but a fast kernel for the approximate recurrence does not recover
              the exact running-state one; no compact exact WY/UT transform is known for this nonlinear write.
            </p>
            <ChartFrame title="Mixer throughput, fwd+bwd (A100, B8·T2048·d256·H4)"
              sub="Thousands of tokens/sec. The linear baselines (fla) beat dense attention; the fused Trellis kernel closes most — not all — of the gap. The ~4× residual is the measured cost of these implementations (two passes, nonlinear VJP, fp32 state), not a proven lower bound.">
              <BarChart data={THRU} layout="vertical" margin={{top:8, right:40, left:30, bottom:8}}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.slate}/>
                <XAxis type="number" stroke="#94a3b8" label={{value:'k tok/s', position:'insideBottom', offset:-2, fill:'#94a3b8'}}/>
                <YAxis type="category" dataKey="mixer" stroke="#94a3b8" width={120} tick={{fontSize:11}}/>
                <Tooltip content={<Tip/>}/>
                <Bar dataKey="tps" name="k tok/s" radius={[0,3,3,0]}>
                  {THRU.map((d,i)=><Cell key={i} fill={d.kind==='linear'?C.green:(d.kind==='dense'?C.gray:(d.kind==='trellis'?C.violet:C.slate))}/>)}
                </Bar>
              </BarChart>
            </ChartFrame>
            <div className="bg-[#0b1220] border border-gray-800 rounded-lg p-4 text-sm text-gray-400">
              <strong className="text-gray-200">The decode flip.</strong> The kernel tax is a training/prefill cost. At
              <em> decode</em> the bounded fixed-size state is length-independent &mdash; constant per-token cost, no
              growing cache to reread &mdash; though it is a dense, hot, read-modify-write object every token, so whether
              it beats modern GQA KV depends on state size, precision, batch, and hardware, not automatically at every
              context. That is the reason the family connects to knlp&rsquo;s decode and KV-compression work: a bounded
              state is an aggressive form of KV compression.
            </div>
          </Section>

          {/* 6b. the two training strategies */}
          <Section id="strategies" kicker="The training strategy" title="How Trellis trains anyway: two independent choices">
            <p>
              Losing the exact factorization does not mean training sequentially. Two choices, often conflated,
              define how a nonlinear fast-weight memory is actually trained: <strong className="text-white">which
              forward state the inner correction sees</strong>, and <strong className="text-white">whether the outer
              loss differentiates through that correction</strong>. They are independent axes. This study spent weeks
              treating them as one knob, and the distinction turned out to carry most of the final result.
            </p>

            <h3 className="font-semibold text-gray-200 mt-6 mb-2">Axis 1 &mdash; the forward state: exact factorization vs. chunk-start linearization</h3>
            <p>
              The linear cousins take the exact route. Each of their steps is affine in the state, affine maps
              compose, and a chunk of rank-one updates collapses into the WY/UT factorization &mdash; the WY low-rank
              representation compacts the chunk&rsquo;s transitions, a UT triangular solve constructs the factors, and
              the recurrence being computed is the <em>true</em> one. Trellis&rsquo;s write is not affine in the state,
              so this factorization does not exist for it. The paper&rsquo;s strategy is different, and explicit:
              <em> freeze the state at each chunk&rsquo;s start</em>. With the state frozen, the within-chunk recurrence
              becomes locally linear, and a parallel scan computes it. The wall-clock shape of training is the same
              chunk-parallel pattern its cousins use; what differs is the object being computed.
            </p>
            <div className="bg-[#0b1220] border-l-4 rounded-lg p-4 my-4 text-sm" style={{borderLeftColor:C.violet}}>
              <strong className="text-violet-300">Identical parallelism, different system.</strong>
              <span className="text-gray-400"> Both families train chunk-parallel. The linear cousins scan the true
              recurrence, because it already is linear. Trellis scans a <em>linearization</em> of its recurrence,
              because the true one cannot be factorized this way &mdash; and the gap between the two grows with the
              step size, the chunk length, and the curvature of <span className="kbd">φ</span>. The true within-chunk
              recurrence stays recoverable (the coupling is nilpotent, so an in-chunk iteration converges to it
              exactly), but only at the cost of the sequential pass &mdash; a correctness oracle, not a speed win.</span>
            </div>

            <h3 className="font-semibold text-gray-200 mt-6 mb-2">Axis 2 &mdash; the outer gradient: differentiate through the inner correction, or not</h3>
            <p>
              The memory update is itself a gradient step on an inner objective, so training the surrounding network
              means differentiating a loss that <em>contains a gradient</em>. Keeping that path &mdash; the
              <span className="kbd"> &part;u/&part;z</span> term, with its Hessian-vector products &mdash; is the full
              bilevel objective, the same gradient-through-a-gradient that MAML formalized and that TTT, this
              architecture&rsquo;s direct ancestor, describes outright. Cutting it &mdash; detaching
              <span className="kbd"> z</span> before the inner correction &mdash; is the first-order approximation:
              cheaper, and the only gradient the update still carries flows through the write target. The two modes
              produce <em>bit-identical forward values</em>; only the parameter gradients differ. That is precisely why
              a dead switch went unnoticed here for a month: the flag selecting the bilevel objective never reached the
              chunked backends, so every chunked run had silently trained first-order while the configuration said
              otherwise. Both modes are now explicit, enforced by the dispatcher, and covered by tests that assert
              equal forwards and strictly different gradients.
            </p>
            <p>
              There is also a principled middle ground: compute both corrections &mdash; numerically equal &mdash; and
              blend only their gradient paths, <span className="kbd">u = u_detached + ρ·(u_live − u_detached)</span>.
              The forward update is unchanged for any <span className="kbd">ρ</span>; the higher-order signal alone is
              scaled. At <span className="kbd">ρ=0.5</span> this tempered form completed every seed where full strength
              failed two of three, and beat first-order training in every paired seed by a small, consistent margin.
            </p>

            <div className="bg-[#0b1220] border border-gray-800 rounded-lg p-4 my-4 text-sm text-gray-400">
              <strong className="text-gray-200">Why the axes must not be conflated.</strong> The completed factorial at
              20M tokens (three paired seeds, identical data, stabilized recipe) gives a different answer in every cell:
              <span className="block mt-2 font-mono text-xs leading-relaxed">
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;first-order&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;full-bilevel<br/>
                identity&nbsp;&nbsp;&nbsp;~253 ppl (3/4 clean)&nbsp;&nbsp;&nbsp;244.5 (3/3, best stable)<br/>
                SiLU&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;251.6 (3/3)&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;1/3 seeds complete
              </span>
              <span className="block mt-2">Under first-order training the nonlinear write beats the linear one; under
              the full bilevel objective the linear write is best and fully stable while full-strength SiLU
              hypergradients destabilize training. No write-nonlinearity ranking exists independent of the gradient
              semantics &mdash; a comparison that fixes one axis and varies the other is measuring the interaction,
              not the write.</span>
            </div>
            <p className="text-xs text-gray-500">
              The paper specifies axis 1 (the chunk-start freeze) and leaves axis 2 undeclared &mdash; its bilevel
              framing and its ancestry point one way, one of its citations points the other. Both readings are
              implemented here and reported side by side rather than argued from the text.
            </p>
          </Section>

          {/* 8. empirical proof: identity-φ control */}
          <Section id="identity" kicker="The empirical control" title="Linearizing the write: the nonlinear one is worse (2× is a joint φ/f control)">
            <p>
              The theorem says the nonlinear write costs the standard exact kernel. The obvious next question is whether
              it at least buys quality to pay for that. The intended test is a <strong>same-shell control</strong>: the
              identical Trellis mixer, projections, two-pass shell, and parameter budget, changing the write nonlinearity
              <span className="kbd"> φ</span>. <strong className="text-amber-300">A caveat we owe the reader (since resolved):</strong> our
              harness <em>previously tied</em> <span className="kbd">φ</span> and the inter-pass map <span className="kbd">f</span> to one
              activation field, so setting <span className="kbd">φ = identity</span> linearized <em>both</em> &mdash; a
              joint <span className="kbd">φ/f</span> linearization, not a clean write-only control, and it also ran
              under the stale-chunk-16 approximation, which is far harsher on the nonlinear arm. <span className="kbd">φ</span> and <span className="kbd">f</span> are
              now decoupled, and the clean write-only rerun (<span className="kbd">φ</span> varied, <span className="kbd">f</span> held at LN-SiLU) has been run
              on the associative-recall probe: the nonlinear write lands behind the linear (0.62 vs a perfect 1.0 recall,
              3 seeds). The paper&rsquo;s own clean write-only control holds <span className="kbd">f</span> at LN-SiLU and puts the write&rsquo;s LM cost at
              11.65 vs 10.87 = 0.78 ppl. The chart below is the original joint control, at matched learning rate and tokens.
            </p>
            <ChartFrame title="Same-shell φ control — val PPL (lower better), ~4.7M / C4 / 120M tokens"
              sub="The write nonlinearity and the inter-pass map both change (φ/f were tied for this run; since decoupled). Green = linearized (φ=identity); violet = the nonlinear ln_silu write in several configs.">
              <BarChart data={IDENTITY} layout="vertical" margin={{top:8, right:44, left:20, bottom:8}}>

                <XAxis type="number" stroke="#94a3b8" domain={[0,280]} label={{value:'val PPL', position:'insideBottom', offset:-2, fill:'#94a3b8'}}/>
                <YAxis type="category" dataKey="row" stroke="#94a3b8" width={190} tick={{fontSize:10}}/>
                <Tooltip content={<Tip/>}/>
                <Bar dataKey="ppl" name="val PPL" radius={[0,3,3,0]}>
                  {IDENTITY.map((d,i)=><Cell key={i} fill={d.kind==='linear'?C.green:C.violet}/>)}
                </Bar>
              </BarChart>
            </ChartFrame>
            <p>
              At matched learning rate (3e-4), matched tokens, and the identical shell, the linearized config reaches
              <strong className="text-white"> 127.9</strong> versus the nonlinear write&rsquo;s
              <strong className="text-white"> 248.4</strong> &mdash; nearly 2× lower perplexity. The paper-shell nonlinear
              config (output path, value-readout activation, high &beta;-init) reaches 182.8, still behind. The

              linearized the inter-pass map (since decoupled) and ran under the stale-chunk-16 handicap. The write-only

              write-only ablation puts the isolated LM cost at ~0.78 ppl.
            </p>
            <div className="bg-[#0b1220] border border-gray-800 rounded-lg p-4 text-sm text-gray-400">
              <strong className="text-gray-200">What the nonlinearity actually buys: stability.</strong> The
              identity-<span className="kbd">φ</span> run only trains at the low learning rate &mdash; it diverges (NaN
              within ~200 steps) at 1e-3 and above &mdash; consistent with dropping the normalizing nonlinearity that

            </div>

          {/* 8b. DeltaProduct on language loss */}
          <Section id="deltaproduct" kicker="The other expressivity bet" title="GatedDeltaProduct-2: aces overwrite, trails GDN on LM at pilot scale">
            <p>
              A different way to add power to a delta rule is <strong>GatedDeltaProduct</strong>: several Householder
              rotations per step &mdash; a more expressive but still state-linear (affine) transition &mdash; which give
              exact multi-step overwrite, delete-then-write in one token. We test the paper&rsquo;s exact headline variant,
              <strong> Gated DeltaProduct-2</strong> (nh2, negative eigenvalues, forget gate on &mdash; the fla reference
              layer). On a synthetic overwrite/binding grid it solves the task near-perfectly (1.000) &mdash; the task its
              extra rotations are built for &mdash; but Gated DeltaNet essentially ties it there (0.996), and both solve it
              while Trellis and the nonlinear-write variants stay near chance. This is directional evidence of strong
              synthetic overwrite behaviour, not a replication of the paper&rsquo;s permutation-group state-tracking. The
              question is whether the exact-overwrite machinery transfers to real language modeling. On a
              <span className="kbd"> d512/L10</span> pilot &mdash; sequence 2048, 20M tokens, three seeds, fla reference
              layers on one packed stream &mdash; not at this scale: Gated DeltaNet wins on C4 loss. Note this is
              <em> width-matched, not parameter-matched</em> &mdash; DeltaProduct-2 carries <strong>49.9M</strong> params
              to GDN&rsquo;s <strong>44.7M</strong> (+12%) and does two Householder micro-steps per token (~2&times; the
              recurrence work), so it was given <em>more</em> compute and still lost.
            </p>
            <ChartFrame title="C4-en pilot — val PPL (lower better), d512/L10, 20M tokens, 3 seeds"
              sub="At this pilot scale Gated DeltaNet leads on C4 loss; DeltaProduct-2 got more params + compute and still trailed. Green = leader, violet = DeltaProduct-2, red = dense.">

                </Bar>
              </BarChart>
            </ChartFrame>
            <p>
              At the 20M-token endpoint Gated DeltaNet reaches <strong>215.7</strong> vs Gated DeltaProduct-2&rsquo;s
              <strong> 224.4</strong> &mdash; about <strong>0.039 nats/token</strong> (~4% relative), reproducible across
              three non-overlapping seed sets. That is a configuration-specific <em>early-training</em> result (0.43
              tokens per parameter), not a converged or best-tuned verdict. Crucially it does <em>not</em> refute the
              paper: their 35B-token FineWeb comparison used negative eigenvalues for <em>both</em> models and put a 393M
              Gated DeltaProduct-2 against a 340M Gated DeltaNet at ~0.033 nats/token &mdash; a similar magnitude to ours
              but opposite sign, un-matched on params and FLOPs, and shrinking to just 0.14 ppl under the one
              parameter-matched control they run. So DeltaProduct&rsquo;s LM edge is real but thin and compute-favored,
              and at our pilot scale it has not appeared. At this scale, for this recipe, Gated DeltaNet is the quality
              leader across every comparison we ran &mdash; the state-matched d512/L10 runs and the param-matched A100
              run alike.
            </p>
          </Section>

          {/* 9. verdict / closed */}
          <Section id="verdict" kicker="The verdict" title="Line closed — what we keep and what stays parked">
            <p>
              The bounded-memory family beats a matched dense Transformer at long context &mdash; that part is solid and
              is the keeper. Within the family, at every scale we could afford, <strong>Gated DeltaNet is the
              matched-state quality leader</strong>: simpler, lower-variance, exact-chunkable, faster, and better on
              loss. The two ways of adding expressivity to the write that we studied &mdash; Trellis&rsquo;s nonlinear
              gain and GatedDeltaProduct&rsquo;s extra rotations &mdash; each win a targeted task; at the pilot scale we
              can afford both trail plain soft gated decay on real C4 loss (DeltaProduct-2 only by a thin ~4%, and its LM
              advantage over GDN is a modest, compute-favored effect the paper reports only at 340M/35B tokens). Trellis
              carries the extra burden that its chunk-parallel training runs on a chunk-start linearization of the
              recurrence, where its linear cousins train on the exact one. We are closing
              this as an active line.
            </p>
            <div className="grid md:grid-cols-2 gap-4 my-2">
              <div className="bg-[#0b1220] border border-gray-800 rounded-lg p-4 text-sm text-gray-400">
                <strong className="text-green-300">What we keep.</strong>
                <ul className="list-disc pl-5 space-y-1 mt-2">
                  <li>Bounded memory beat matched dense at every PG19 length we tested &mdash; the structural win the family exists for.</li>
                  <li>Gated DeltaNet as the trusted matched-state baseline for downstream KV / decode work.</li>
                  <li>The fused Triton kernel and an fla-mapped fast path &mdash; reusable regardless of Trellis.</li>
                  <li>The negatives as knowledge: at the pilot scale we can afford, extra write expressivity (nonlinear gain, exact rotations) buys no C4-loss win over plain gated decay; DeltaProduct-2&rsquo;s modest LM edge is a 340M/35B-token, compute-favored effect.</li>
                </ul>
              </div>
              <div className="bg-[#0b1220] border border-gray-800 rounded-lg p-4 text-sm text-gray-400">
                <strong className="text-amber-300">What stays parked (not disproven).</strong>
                <p className="mt-2">
                  The paper&rsquo;s headline is a <strong>scale</strong> claim at 790M / 30B (Trellis 20.28 vs Gated
                  DeltaNet 21.40) &mdash; a regime we never trained. The decisive test is a faithful 125M / 2.4B
                  reproduction; an independent fairness audit&rsquo;s project-planning estimate (not a measured result)
                  put the odds it reproduces at about
                  <strong> 0.30</strong>, on a thin (~5% ppl) margin, with several reconstruction ambiguities. A
                  low-probability, thin-margin, multi-day run, when every cheaper probe here is negative, is a line to
                  park behind a clear reason &mdash; not to pursue on its odds. The harness makes the test cheap to bolt
                  on if that reason appears.
                </p>
              </div>
            </div>
            <p className="text-sm text-gray-500">
              Bottom line: at the scale we can afford, the linear delta rule with a good forget gate is the thing to
              build on; Trellis&rsquo;s nonlinear write does not pay for itself &mdash; structurally its chunk-parallel
              training is a chunk-start linearization rather than the exact recurrence, and empirically it trails both linear cousins in the fair matched run (a same-shell
              linearization is ~2× better, though that 2× is a joint <span className="kbd">φ/f</span> control since
              decoupled &mdash; a write-only recall rerun confirms the direction, and the paper&rsquo;s clean write-only
              LM cost is ~0.78 ppl). The paper&rsquo;s 790M scale claim is parked, not disproven.
            </p>
          </Section>

            <p className="mt-2 text-xs">Last claim audit: 2026-08-04 &mdash; correctness audit re-closed the line. The flag selecting the bilevel training objective had never reached the chunked backends, so closure-era chunked runs trained first-order; explicit state-mode &times; gradient-mode semantics and float64-verified higher-order references landed, and the completed factorial shows the write ranking depends on gradient semantics: SiLU ahead of identity under first-order training, identity best and fully stable under full-bilevel, full-strength SiLU hypergradients unstable in two of three seeds. A tempered higher-order correction (&rho;=0.5, forward update unchanged) is stable in all seeds with a small consistent gain below the scaling threshold. Gated DeltaNet and identity-bilevel tie at 20M tokens; by 40M all three paired gaps move toward Gated DeltaNet. Earlier entries: 2026-07-27 &mdash; decoupled the write <span className="kbd">&phi;</span> and inter-pass <span className="kbd">f</span> (previously tied to one field) and ran the clean write-only ablation with <span className="kbd">f</span> held at LN-SiLU on the associative-recall probe (nonlinear write behind linear); the C4 perplexity magnitude with <span className="kbd">f</span> fixed remains the open rerun. 2026-07-21 &mdash; retired the &ldquo;only at 790M&rdquo; fact and the clean write-only causal read of the ~2&times; gap; softened the &ldquo;theorem rules out&rdquo; / &ldquo;no-parallel-scan floor&rdquo; prose; scoped the GatedDeltaProduct-2 LM result to pilot scale (nats/relative, real per-arm params; the paper&rsquo;s own comparison is un-matched at 393M vs 340M). Ledger: <a href="https://github.com/mcgrof/knlp/blob/main/reports/trellis_claim_audit.md" className="hover:text-gray-400">reports/trellis_claim_audit.md</a>.</p>
