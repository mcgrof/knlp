<!DOCTYPE html>
<html lang="en">
<head>

<title>Memory-Traffic Saturation in Autoregressive Transformer Decode</title>
<style>
body{margin:0;background:#080c0a;color:#d4e8d0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
main{max-width:760px;margin:12vh auto;padding:28px;border:1px solid #1e2e20;border-radius:10px;background:#111810}
a{color:#00d4c8}code{color:#f0a030}
</style>
</head>
<body>
<main id="status"><h1>Loading the decode report…</h1>
<p>Preparing the interactive page.</p>
<noscript><p>JavaScript is required. Open <a href="paper_memory_decode.body.html">the full report</a> and <a href="fp8-attention-tile-path.html">the FP8 tile measurement plan</a>.</p></noscript></main>
<script>
(async()=>{
  const r=await fetch('paper_memory_decode.body.html',{cache:'no-store'});
  if(!r.ok)throw new Error(`fetch failed: ${r.status}`);
  let s=await r.text();
  const rules=[
    [/within measurement noise and is 33% faster than symmetric FP8 by avoiding the serial K-dequant path\./g,
     'within measurement noise and is 33% faster than the measured symmetric FP8 path. Measure this delta as the balance between one fewer K byte per element and BF16-Q/FP8-K tile preparation.',2],
    [/Storing keys at native 16-bit precision and only quantizing values to FP8 keeps <em>K<\/em> dequantization off\s+the softmax serial critical path \(it never happens\) while <em>V<\/em> dequantization overlaps with the reduction\s+pipeline\./g,
     "Storing keys at native 16-bit precision and only quantizing values to FP8 removes FP8 K operand preparation before each tile's QK operation. Account for FP8 V preparation before PV and measure how much the kernel overlaps it.",1],
    [/FP8 K \+ FP8 V · K dequant on softmax critical path · 3–8% throughput penalty on H100\./g,
     'FP8 K + FP8 V · one fewer K byte per element, plus on-chip K preparation before QK. Measure the H100 tile interval against K16/V8.',1],
    [/On NVIDIA Hopper, Tensor Core FP8 MMA requires matching operand dtypes,[\s\S]*?style="color:var\(--cyan\);">hardware notes<\/a>\./g,
     'Hopper has no native BF16-query by plain-FP8-key QK instruction with a K scale operand. Prepare each active K tile on chip before QK and advance online softmax tile by tile. Compare the unhidden preparation and occupancy cost against the extra K16 HBM byte. Account for V preparation before PV. CDNA 3 provides FP8-by-FP8 MFMA with no scale operands; place the scale in software around MFMA. Run the <a href="fp8-attention-tile-path.html" style="color:var(--cyan);">tile-path microtests</a> and use the <a href="https://github.com/mcgrof/knlp/blob/main/docs/fused-quant/fp8-attention-hardware-notes.md" style="color:var(--cyan);">hardware notes</a>.',1],
    [/Symmetric FP8 falls below asymmetric on every model because[\s\S]*?V dequant\./g,
     'Symmetric FP8 falls below asymmetric on every model in this fixed-batch comparison. Measure the cause with K-only and V-only dtype controls, Blackwell transform modes, warm and cold cache states, and profiler traces. Attribute the gap only when the K-preparation signal moves with the latency delta.',1],
    [/<strong>\+2\.9% on Qwen2\.5-7B \(1\.38× vs 1\.34× FP16\)<\/strong>\. This gap is structural, not noise:[\s\S]*?ahead of softmax\./g,
     '<strong>+2.9% on Qwen2.5-7B (1.38× vs 1.34× FP16)</strong>. Treat the ordering as the measured result. Identify its cause with the tile-path matrix: K16/V8 removes FP8 K preparation, while K8/V8 saves one HBM byte per K element. Measure overlap, occupancy, cache state, and shape.',1],
    [/The K-dequant throughput penalty appears across batch and context too:[\s\S]*?standard KV cache/g,
     'The measured symmetric path remains slower across batch and context: at T=16,384, symmetric FP8 reaches 0.78×–0.80× of FP16 throughput across B ∈ [4, 32]. Run the controlled tile-path ablation at these shapes. Even on a model where 75% of layers do not use the standard KV cache',1],
    [/remains well below peak on both architectures\.  On the AMD side,[\s\S]*?for structural reasons\./g,
     'remains well below peak on both architectures. CDNA 3 has native FP8-by-FP8 MFMA with no scale operands. Measure the smaller symmetric-FP8 cost on the tested MI300X path (1.7–2.5%) against H100 (3–8%) with matched kernel, scale-placement, layout, and scheduling profiles.',1],
    [/requirement\.  Blackwell preserves that requirement for the legacy FP8 path[\s\S]*?time of writing\./g,
     'requirement. Blackwell adds block-scaled MXFP8 with hardware consumption of per-block scales for narrow Q and K. FlashInfer contains an SM100 block-scaled fused-attention implementation. Validate its paged-cache layout, model shapes, numerical policy, and serving dispatch against plain E4M3 transformation and K16/V8.',1],
    [/For maximum capacity, symmetric FP8 doubles KV storage at a 3–8% throughput cost on H100[\s\S]*?The custom fused INT4 Triton kernel/g,
     'For maximum capacity, ordinary symmetric FP8 doubles KV storage and shows a 3–8% cost on the measured H100 path and 1.7–2.5% on the measured MI300X path. Treat those numbers as kernel and shape results. Use bias-aware pre-bias K8/V8 on Qwen2.5-7B after the quality gate. The custom fused INT4 Triton kernel',1]
  ];
  for(const [repl,newText,expected] of rules){
    const matches=s.match(repl);
    const count=matches?matches.length:0;
    if(count!==expected)throw new Error(`page transform expected ${expected}, found ${count}`);
    s=s.replace(repl,newText);
  }
  document.open();document.write(s);document.close();
})().catch(error=>{
  document.getElementById('status').innerHTML=`<h1>Page loader failed</h1><p><code>${String(error)}</code></p><p>Open <a href="paper_memory_decode.body.html">the full report</a> and <a href="fp8-attention-tile-path.html">the FP8 tile measurement plan</a>.</p>`;
});
</script>
</body>
</html>
