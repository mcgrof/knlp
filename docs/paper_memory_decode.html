<script>
(async()=>{
  const r=await fetch('paper_memory_decode.body.html',{cache:'no-store'});
  if(!r.ok)throw new Error(`fetch failed: ${r.status}`);
  let s=await r.text();
  const rules=[
    [/within measurement noise and is 33% faster than symmetric FP8 by avoiding the serial K-dequant path\./g,
     'within measurement noise and is 33% faster than the measured symmetric FP8 path. A per-tile K-preparation hypothesis may explain that gap, but controlled transform and profiler ablations are still pending.',2],
    [/Storing keys at native 16-bit precision and only quantizing values to FP8 keeps <em>K<\/em> dequantization off\s+the softmax serial critical path \(it never happens\) while <em>V<\/em> dequantization overlaps with the reduction\s+pipeline\./g,
     "Storing keys at native 16-bit precision and only quantizing values to FP8 removes FP8 K operand preparation before each tile's QK operation. V remains FP8 and still requires work before PV, although a good kernel can overlap much of it.",1],
    [/FP8 K \+ FP8 V · K dequant on softmax critical path · 3–8% throughput penalty on H100\./g,
     'FP8 K + FP8 V · smaller HBM footprint, plus an on-chip K preparation path before QK. The measured H100 path trails K16/V8 at these shapes.',1],
    [/On NVIDIA Hopper, Tensor Core FP8 MMA requires matching operand dtypes,[\s\S]*?style="color:var\(--cyan\);">hardware notes<\/a>\./g,
     'Hopper has no native BF16-query by plain-FP8-key QK instruction with a K scale operand. A fused symmetric kernel prepares each K tile on chip before QK; it does not materialize a BF16 K cache in HBM. Online softmax advances tile by tile, so K preparation must finish before that tile\'s QK and softmax update. K16/V8 removes that stage but reads one extra K byte per element. V preparation is still real work and may or may not be hidden by the PV pipeline. CDNA 3 provides FP8-by-FP8 MFMA, but the instruction has no scale operands; current AITER applies scale outside MFMA. See the <a href="fp8-attention-tile-path.html" style="color:var(--cyan);">tile-path hypothesis and microtests</a> and the <a href="https://github.com/mcgrof/knlp/blob/main/docs/fused-quant/fp8-attention-hardware-notes.md" style="color:var(--cyan);">hardware notes</a>.',1],
    [/Symmetric FP8 falls below asymmetric on every model because[\s\S]*?V dequant\./g,
     'Symmetric FP8 falls below asymmetric on every model in this fixed-batch comparison. The working hypothesis is that the selected BF16-Q/FP8-K path pays an unhidden per-tile K preparation cost that outweighs the extra K16 byte traffic at these shapes. The transform-mode and profiler ablations needed to establish that cause are open.',1],
    [/<strong>\+2\.9% on Qwen2\.5-7B \(1\.38× vs 1\.34× FP16\)<\/strong>\. This gap is structural, not noise:[\s\S]*?ahead of softmax\./g,
     '<strong>+2.9% on Qwen2.5-7B (1.38× vs 1.34× FP16)</strong>. The ordering is measured; its cause is a falsifiable tile-path hypothesis, not yet a structural proof. K16/V8 removes FP8 K preparation, while K8/V8 saves one HBM byte per K element. Which term wins depends on overlap, occupancy, cache state, and shape.',1],
    [/The K-dequant throughput penalty appears across batch and context too:[\s\S]*?standard KV cache/g,
     'The measured symmetric path remains slower across batch and context too: at T=16,384, sym FP8 is 0.78×–0.80× of FP16 throughput across B ∈ [4, 32]. The tile-preparation explanation still requires a controlled kernel ablation. Even on a model where 75% of layers do not use the standard KV cache',1],
    [/remains well below peak on both architectures\.  On the AMD side,[\s\S]*?for structural reasons\./g,
     'remains well below peak on both architectures. CDNA 3 has native FP8-by-FP8 MFMA, but that instruction does not consume scale operands and does not by itself explain the MI300X/H100 difference. The measured symmetric-FP8 cost is smaller on the tested MI300X path (1.7–2.5%) than on H100 (3–8%); the responsible kernel, scale placement, layout, and scheduling differences still need a matched profiler study.',1],
    [/requirement\.  Blackwell preserves that requirement for the legacy FP8 path[\s\S]*?time of writing\./g,
     'requirement. Blackwell also introduces block-scaled MXFP8, where hardware consumes per-block scales for narrow Q and K operands. This is not the same as CDNA 3 MFMA, which has no scale operands. FlashInfer now contains an SM100 block-scaled fused-attention implementation; the open deployment question is whether the paged-cache layout, model shapes, numerical policy, and serving dispatch make it the best decode path for this workload.',1],
    [/For maximum capacity, symmetric FP8 doubles KV storage at a 3–8% throughput cost on H100[\s\S]*?The custom fused INT4 Triton kernel/g,
     'For maximum capacity, ordinary symmetric FP8 doubles KV storage and showed a 3–8% cost on the measured H100 path and 1.7–2.5% on the measured MI300X path. Those are kernel results, not architecture constants. Bias-aware pre-bias K8/V8 also makes symmetric FP8 quality-admissible on Qwen2.5-7B in the current precision tests. The custom fused INT4 Triton kernel',1]
  ];
  for(const [repl,newText,expected] of rules){
    const matches=s.match(repl);
    const count=matches?matches.length:0;
    if(count!==expected)throw new Error(`guarded replacement expected ${expected}, found ${count}: ${repl}`);
    s=s.replace(repl,newText);
  }
  document.open();document.write(s);document.close();
})().catch(error=>{

});
