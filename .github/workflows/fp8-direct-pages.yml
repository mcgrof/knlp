name: Materialize direct FP8 pages

on:
  push:
    paths:
      - .github/workflows/fp8-direct-pages.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write direct pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paper_body = Path('docs/paper_memory_decode.body.html')
          paper = paper_body.read_text()
          replacements = [
              (
                  '    prefill/decode kernels. At the standalone-kernel level on the headline Qwen2.5-7B lane, K16/V8 matches FP16\n'
                  '    within measurement noise and is 33% faster than symmetric FP8 by avoiding the serial K-dequant path.\n'
                  '    Behind the practical result: throughput scaling is governed primarily by memory traffic, while quantization\n',
                  '    prefill/decode kernels. At the standalone-kernel level on the headline Qwen2.5-7B lane, K16/V8 matches FP16\n'
                  '    within measurement noise and is 33% faster than the measured symmetric FP8 path. Measure this delta as the\n'
                  '    balance between one fewer K byte per element and BF16-Q/FP8-K tile preparation.\n'
                  '    Behind the practical result: throughput scaling is governed primarily by memory traffic, while quantization\n',
              ),
              (
                  '    Storing keys at native 16-bit precision and only quantizing values to FP8 keeps <em>K</em> dequantization off\n'
                  '    the softmax serial critical path (it never happens) while <em>V</em> dequantization overlaps with the reduction\n'
                  '    pipeline. At the standalone FlashInfer kernel level on the headline Qwen2.5-7B lane, asymmetric K16/V8 matches\n'
                  '    FP16 within measurement noise and is 33% faster than symmetric FP8 by avoiding the serial K-dequant path.\n',
                  '    Storing keys at native 16-bit precision and only quantizing values to FP8 removes FP8 K operand preparation\n'
                  "    before each tile's QK operation. Account for FP8 V preparation before PV and measure how much the kernel\n"
                  '    overlaps it. At the standalone FlashInfer kernel level on the headline Qwen2.5-7B lane, asymmetric K16/V8\n'
                  '    matches FP16 within measurement noise and is 33% faster than the measured symmetric path.\n',
              ),
              (
                  '      <span class="pipe-desc">FP8 K + FP8 V · K dequant on softmax critical path · 3–8% throughput penalty on H100.\n'
                  '        On fragile-key models (Qwen) collapses: ppl 8.4 → 151 at 32K, NIAH retrieval 0.84 → 0.00.</span>\n',
                  '      <span class="pipe-desc">FP8 K + FP8 V · one fewer K byte per element, plus on-chip K preparation before QK.\n'
                  '        Measure the H100 tile interval against K16/V8. Ordinary post-bias K8 also collapses on fragile Qwen models.</span>\n',
              ),
              (
                  '    On NVIDIA Hopper, Tensor Core FP8 MMA requires matching operand dtypes, so symmetric FP8 must dequantize K to\n'
                  '    FP16 before the <em>q · k</em> dot product that feeds softmax. Softmax cannot emit any attention weight until all\n'
                  '    scores are in — so K dequant serialises ahead of softmax and every cycle spent converting K adds directly to\n'
                  '    per-token decode latency. Asymmetric K16/V8 keeps K at native precision so no K dequant is needed; V dequant feeds\n'
                  '    an associative reduction and overlaps with the accumulation pipeline. The hardware-level equivalent on AMD CDNA 3\n'
                  '    is WMMA FP8 matmul with scales absorbed into the accumulator — same bottleneck, solved in silicon rather than in\n'
                  '    software. See the <a href="https://github.com/mcgrof/knlp/blob/main/docs/fused-quant/fp8-attention-hardware-notes.md"\n'
                  '      style="color:var(--cyan);">hardware notes</a>.\n',
                  '    Hopper has no native BF16-query by plain-FP8-key QK instruction with a K scale operand. Prepare each active K\n'
                  '    tile on chip before QK and advance online softmax tile by tile. Compare the unhidden preparation and occupancy\n'
                  '    cost against the extra K16 HBM byte. Account for V preparation before PV. CDNA 3 provides FP8-by-FP8 MFMA with\n'
                  '    no scale operands; place the scale in software around MFMA. Run the\n'
                  '    <a href="fp8-attention-tile-path.html" style="color:var(--cyan);">tile-path microtests</a> and use the\n'
                  '    <a href="https://github.com/mcgrof/knlp/blob/main/docs/fused-quant/fp8-attention-hardware-notes.md"\n'
                  '      style="color:var(--cyan);">hardware notes</a>.\n',
              ),
              (
                  '    Symmetric FP8 falls below asymmetric on every model because K dequantization under symmetric FP8 lies\n'
                  '    on the softmax serial critical path, whereas asymmetric keeps K at native precision and only pipelines\n'
                  '    V dequant.\n',
                  '    Symmetric FP8 falls below asymmetric on every model in this fixed-batch comparison. Measure the cause with\n'
                  '    K-only and V-only dtype controls, Blackwell transform modes, warm and cold cache states, and profiler traces.\n'
                  '    Attribute the gap only when the K-preparation signal moves with the latency delta.\n',
              ),
              (
                  '    <strong>+2.9% on Qwen2.5-7B (1.38× vs 1.34× FP16)</strong>. This gap is structural, not noise:\n'
                  '    asymmetric eliminates K dequantization entirely whereas symmetric serializes it ahead of softmax.\n',
                  '    <strong>+2.9% on Qwen2.5-7B (1.38× vs 1.34× FP16)</strong>. Treat the ordering as the measured result.\n'
                  '    Identify its cause with the tile-path matrix: K16/V8 removes FP8 K preparation, while K8/V8 saves one HBM\n'
                  '    byte per K element. Measure overlap, occupancy, cache state, and shape.\n',
              ),
              (
                  '    The K-dequant throughput penalty appears across batch and context too: at T=16,384, sym FP8 is 0.78×–0.80×\n'
                  '    of FP16 throughput across B ∈ [4, 32].  Even on a model where 75% of layers do not use the standard KV cache\n',
                  '    The measured symmetric path remains slower across batch and context: at T=16,384, symmetric FP8 reaches\n'
                  '    0.78×–0.80× of FP16 throughput across B ∈ [4, 32]. Run the controlled tile-path ablation at these shapes.\n'
                  '    Even on a model where 75% of layers do not use the standard KV cache\n',
              ),
              (
                  "    remains well below peak on both architectures.  On the AMD side, MI300X's CDNA 3 WMMA FP8 path eliminates the K-dequant\n"
                  "    serial penalty that Hopper's Tensor Core ISA imposes, so symmetric FP8 carries a much smaller throughput cost on MI300X\n"
                  '    (1.7–2.5%) than on H100 (3–8%) — the asymmetric-vs-symmetric ordering is different across vendors for structural reasons.\n',
                  '    remains well below peak on both architectures. CDNA 3 has native FP8-by-FP8 MFMA with no scale operands.\n'
                  '    Measure the smaller symmetric-FP8 cost on the tested MI300X path (1.7–2.5%) against H100 (3–8%) with matched\n'
                  '    kernel, scale-placement, layout, and scheduling profiles.\n',
              ),
              (
                  '        requirement.  Blackwell preserves that requirement for the legacy FP8 path but introduces block-scaled\n'
                  '        MXFP8 with hardware scale absorption during matmul — the same architectural pattern AMD WMMA FP8 already\n'
                  '        implements on CDNA 3.  A production-quality MXFP8 paged-attention kernel would close the Hopper bottleneck\n'
                  '        on Blackwell at hardware level.  No such kernel exists in the open-source inference stack at time of writing.\n',
                  '        requirement. Blackwell adds block-scaled MXFP8 with hardware consumption of per-block scales for narrow Q\n'
                  '        and K. FlashInfer contains an SM100 block-scaled fused-attention implementation. Validate its paged-cache\n'
                  '        layout, model shapes, numerical policy, and serving dispatch against plain E4M3 transformation and K16/V8.\n',
              ),
              (
                  '    For maximum capacity, symmetric FP8 doubles KV storage at a 3–8% throughput cost on H100 (1.7–2.5% on\n'
                  '    MI300X), and stays quality-safe on tolerant models. The custom fused INT4 Triton kernel\n',
                  '    For maximum capacity, ordinary symmetric FP8 doubles KV storage and shows a 3–8% cost on the measured H100\n'
                  '    path and 1.7–2.5% on the measured MI300X path. Treat those numbers as kernel and shape results. Use bias-aware\n'
                  '    pre-bias K8/V8 on Qwen2.5-7B after the quality gate. The custom fused INT4 Triton kernel\n',
              ),
          ]
          for old, new in replacements:
              count = paper.count(old)
              if count != 1:
                  raise SystemExit(f'paper replacement expected once, found {count}: {old[:80]!r}')
              paper = paper.replace(old, new)
          Path('docs/paper_memory_decode.html').write_text(paper)

          atlas_body = Path('docs/fp8-kv-failure-atlas.body.html')
          atlas = atlas_body.read_text()
          anchor = (
              '            <p className="text-xs text-gray-500">\n'
              '              Phi-2 is the perfect anti-control: its &ldquo;true bias&rdquo; recovery (0.17) actually <em>loses</em> to the random and\n'
              '              permuted controls, and its α-curve is flat. Phi fails for a different reason — which is the next section.\n'
              '            </p>\n'
          )
          insert = anchor + (
              '            <div className="bg-[#07130f] border border-emerald-900/60 rounded-lg p-4 text-sm text-gray-400 mt-4">\n'
              '              <strong className="text-emerald-300">Benchmark bias-aware symmetric FP8.</strong>\n'
              '              Run pre-bias K8/V8 against ordinary K8/V8 and K16/V8. Measure per-tile K operand preparation,\n'
              '              exact bias reconstruction or score correction, RoPE placement, scale traffic, and HBM bytes.\n'
              '              Use the <a href="fp8-attention-tile-path.html" className="text-cyan-300 hover:underline"> FP8\n'
              '              attention tile measurement plan</a> for the dtype controls, profiler matrix, and decision rules.\n'
              '            </div>\n'
          )
          count = atlas.count(anchor)
          if count != 1:
              raise SystemExit(f'atlas insertion expected once, found {count}')
          Path('docs/fp8-kv-failure-atlas.html').write_text(atlas.replace(anchor, insert))

          paper_body.unlink()
          atlas_body.unlink()
          Path('.github/workflows/fp8-direct-pages.yml').unlink()
          PY

      - name: Commit direct pages
        shell: bash
        run: |
          git config user.name "Luis Chamberlain"
          git config user.email "mcgrof@do-not-panic.com"
          git add -A docs .github/workflows/fp8-direct-pages.yml
          git commit -m "docs/fp8: materialize the direct interactive pages" \
            -m "Write the decode report and failure atlas directly with imperative technical prose. Remove the staging bodies and one-shot workflow." \
            -m "Generated-by: ChatGPT GPT-5.6 Pro" \
            -m "Signed-off-by: Luis Chamberlain <mcgrof@do-not-panic.com>"
          git push origin HEAD:main
