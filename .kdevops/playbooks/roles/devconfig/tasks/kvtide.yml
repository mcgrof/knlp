---
# SPDX-License-Identifier: copyleft-next-0.3.1
#
# KVTide bench dependencies for the software NVMe-KV and physical PCIe
# modes. The optional DKMS packages let xNVMe uPCIe import GPU memory
# under UIO and map it through a VFIO IOMMU domain.

- name: Install KVTide build dependencies (Debian family)
  become: yes
  ansible.builtin.apt:
    name:
      - gcc
      - g++
      - make
      - git
      - patch
      - meson
      - ninja-build
      - pkg-config
      - cmake
      - python3-pyelftools
      - liburing-dev
      - libnuma-dev
      - numactl
      - libssl-dev
      - libaio-dev
      - uuid-dev
      - nasm
      - nvme-cli
      - bison
      - flex
      - bc
      - libelf-dev
      - zstd
      - python-is-python3
      - python3-tabulate
      - libfuse3-dev
      - autoconf
      - automake
      - libtool
      - libncurses-dev
      - bsdextrautils
      - pciutils
      - psmisc
      - kmod
      - udev
      - dkms
      - wget
      - "linux-headers-{{ ansible_kernel }}"
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: Note unsupported OS family for KVTide dependencies
  ansible.builtin.debug:
    msg: >
      KVTide dependency provisioning currently covers the Debian
      family only; install the equivalents manually and run
      'make kvtide-doctor' in the knlp checkout to verify.
  when: ansible_facts['os_family'] != 'Debian'

- name: Download the uPCIe dma-buf importer
  become: yes
  ansible.builtin.get_url:
    url: >-
      https://github.com/safl/upcie/releases/download/{{
      workflow_knlp_kvtide_upcie_release }}/dmabuf-import-dkms_{{
      workflow_knlp_kvtide_upcie_dkms_version }}_all.deb
    dest: >-
      /tmp/dmabuf-import-dkms_{{
      workflow_knlp_kvtide_upcie_dkms_version }}_all.deb
    mode: "0644"
  when:
    - ansible_facts['os_family'] == 'Debian'
    - workflow_knlp_kvtide_upcie_cuda | default(false) | bool

- name: Download the uPCIe IOMMU GPU mapper
  become: yes
  ansible.builtin.get_url:
    url: >-
      https://github.com/safl/upcie/releases/download/{{
      workflow_knlp_kvtide_upcie_release }}/iommu-map-pa-dkms_{{
      workflow_knlp_kvtide_upcie_dkms_version }}_all.deb
    dest: >-
      /tmp/iommu-map-pa-dkms_{{
      workflow_knlp_kvtide_upcie_dkms_version }}_all.deb
    mode: "0644"
  when:
    - ansible_facts['os_family'] == 'Debian'
    - workflow_knlp_kvtide_upcie_cuda | default(false) | bool

- name: Install the uPCIe GPU-memory modules
  become: yes
  ansible.builtin.apt:
    deb: "{{ item }}"
  loop:
    - >-
      /tmp/dmabuf-import-dkms_{{
      workflow_knlp_kvtide_upcie_dkms_version }}_all.deb
    - >-
      /tmp/iommu-map-pa-dkms_{{
      workflow_knlp_kvtide_upcie_dkms_version }}_all.deb
  when:
    - ansible_facts['os_family'] == 'Debian'
    - workflow_knlp_kvtide_upcie_cuda | default(false) | bool

- name: Load the uPCIe GPU-memory modules at boot
  become: yes
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kvtide-upcie.conf
    mode: "0644"
    content: |
      dmabuf_import
      iommu_map_pa
  when:
    - ansible_facts['os_family'] == 'Debian'
    - workflow_knlp_kvtide_upcie_cuda | default(false) | bool

- name: Load the uPCIe GPU-memory modules now
  become: yes
  ansible.builtin.command: "modprobe {{ item }}"
  changed_when: false
  loop:
    - dmabuf_import
    - iommu_map_pa
  when:
    - ansible_facts['os_family'] == 'Debian'
    - workflow_knlp_kvtide_upcie_cuda | default(false) | bool
