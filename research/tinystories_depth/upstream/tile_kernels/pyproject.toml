[build-system]
requires = ["setuptools", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "tile_kernels/_version.py"

[project]
name = "tile_kernels"
dynamic = ["version"]
description = "Tilelang-based kernels."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Chenhao Xu", email = "xch@deepseek.com" },
    { name = "Xiangwen Wang", email = "xiangwen.wang@deepseek.com" },
    { name = "Huanqi Cao", email = "caohuanqi@deepseek.com" },
    { name = "Luotian Huang", email = "huanglt@deepseek.com" },
    { name = "Yuxuan Zhou", email = "yzhou@deepseek.com" },
    { name = "Weilin Zhao", email = "zhaoweilin@deepseek.com" },
    { name = "Rui Tian", email = "tianr22@deepseek.com" },
    { name = "Anyi Xu", email = "xay5421@deepseek.com" },
    { name = "Fucong Dai", email = "daifucong@deepseek.com" },
    { name = "Kuai Yu", email = "yukuai@deepseek.com" },
    { name = "Ruifan Xu", email = "xuruifan@deepseek.com" },
    { name = "Yi Qian", email = "qianyi@deepseek.com" },
    { name = "Shengyuan Jia", email = "jia_shengyuan@deepseek.com" },
    { name = "Chenggang Zhao", email = "chenggangz@deepseek.com" },
    { name = "Wei Zhang", email = "recker@deepseek.com" },
    { name = "Lei Wang", email = "lei@deepseek.com" }
]
dependencies = [
    "torch>=2.13",
    "tilelang>=0.1.15"
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["setuptools", "wheel", "setuptools-scm>=8", "pytest", "pytest-xdist", "pytest-repeat"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tile_kernels*"]

[project.urls]
Homepage = "https://github.com/deepseek-ai/TileKernels"

# Linter tools

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["Q000"]
fixable = ["Q000"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
filterwarnings = [
    # torch internal deprecation, unrelated to our code
    "ignore:`torch.jit.script_method` is deprecated:DeprecationWarning",
    # torch_npu environment owner/permission mismatch warnings, unrelated to our code
    "ignore:.*owner does not match the current owner.*:UserWarning",
    "ignore:.*Permission mismatch.*does not match.*:UserWarning",
    # torch_npu internal format fallback notice, unrelated to our code
    "ignore:.*Cannot create tensor with internal format.*:UserWarning",
    # benchmark_timer intentionally disables TileLang profiler warmup
    "ignore:Profiler won't be using warmup, this can skew profiler results:UserWarning:tilelang.profiler.bench",
    # Benchmarks only consume events from the profiler's current cycle
    "ignore:Warning.*Profiler clears events at the end of each cycle.*:UserWarning:torch.profiler.profiler",
]
